<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perennial — VoltIQ Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1220;
    --panel: #101a30;
    --panel-2: #16223d;
    --line: #2a3655;
    --paper: #edeff5;
    --paper-dim: #8791ac;
    --copper: #d68a2e;
    --copper-bright: #e8a33d;
    --verified: #4fb286;
    --alert: #d9695c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .serif { font-family: 'Source Serif 4', Georgia, serif; }
  ::selection { background: var(--copper); color: var(--ink); }

  .login-screen {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .login-screen { grid-template-columns: 1fr; }
    .login-hero { display: none; }
  }
  .login-hero {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px;
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  .login-hero svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; }
  .hero-mark { font-size: 15px; letter-spacing: 0.02em; color: var(--paper-dim); position: relative; z-index: 1; }
  .hero-line { position: relative; z-index: 1; }
  .hero-line h2 { font-size: 30px; font-weight: 500; line-height: 1.3; margin: 0; max-width: 380px; }
  .hero-foot { font-size: 13px; color: var(--paper-dim); position: relative; z-index: 1; }

  .login-form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .login-box { width: 100%; max-width: 340px; }
  .login-box .wordmark { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  .login-box .tagline { font-size: 13px; color: var(--paper-dim); margin: 0 0 40px; }
  .field-label { display: block; font-size: 12px; color: var(--paper-dim); margin-bottom: 6px; }
  .field {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--paper);
    padding: 10px 2px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 26px;
    transition: border-color 0.15s;
  }
  .field:focus { outline: none; border-bottom-color: var(--copper-bright); }
  .btn {
    background: var(--copper);
    color: var(--ink);
    border: none;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn:hover { background: var(--copper-bright); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
  }
  .btn-ghost:hover { border-color: var(--paper-dim); background: transparent; }
  .msg-error { color: var(--alert); font-size: 13px; margin: -14px 0 20px; }
  .msg-ok { color: var(--verified); font-size: 13px; margin: -14px 0 20px; }

  .app { max-width: 960px; margin: 0 auto; padding: 48px 28px 80px; }
  .app-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }
  .app-top .wordmark { font-size: 24px; font-weight: 500; margin: 0; }
  .who { font-size: 13px; color: var(--paper-dim); margin-top: 4px; }
  .stamp {
    display: inline-block;
    border: 1px solid var(--copper);
    color: var(--copper-bright);
    font-size: 11px;
    padding: 2px 8px;
    margin-left: 8px;
    letter-spacing: 0.03em;
  }

  .notice {
    border-left: 2px solid var(--copper);
    padding: 12px 18px;
    font-size: 13px;
    color: var(--paper-dim);
    margin-bottom: 32px;
    background: var(--panel);
  }

  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 28px;
    margin-bottom: 24px;
  }
  .panel-title { font-size: 17px; font-weight: 500; margin: 0 0 20px; }
  .field-row { display: flex; gap: 24px; }
  .field-row > div { flex: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--paper-dim);
    font-size: 12px;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--panel-2); }
  .empty { color: var(--paper-dim); font-size: 14px; padding: 28px 0; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_BASE = 'https://perennial-ingest.momolistic2008.workers.dev';

let state = {
  token: localStorage.getItem('perennial_token') || null,
  username: localStorage.getItem('perennial_username') || null,
  role: localStorage.getItem('perennial_role') || null,
  discoName: localStorage.getItem('perennial_disco') || null,
};

function saveSession(data) {
  state.token = data.token;
  state.username = data.username;
  state.role = data.role;
  state.discoName = data.discoName;
  localStorage.setItem('perennial_token', data.token);
  localStorage.setItem('perennial_username', data.username);
  localStorage.setItem('perennial_role', data.role);
  localStorage.setItem('perennial_disco', data.discoName || '');
}

function clearSession() {
  state = { token: null, username: null, role: null, discoName: null };
  localStorage.removeItem('perennial_token');
  localStorage.removeItem('perennial_username');
  localStorage.removeItem('perennial_role');
  localStorage.removeItem('perennial_disco');
}

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (state.token && !options.noAuth) {
    headers['Authorization'] = `Bearer ${state.token}`;
  }
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(iso) {
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

const gridSVG = `
<svg viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#d68a2e" stroke-width="1" fill="none">
    <path d="M40 620 L120 480 L110 320 L200 250 L190 100" />
    <path d="M120 480 L260 440 L320 300 L280 150" />
    <path d="M200 250 L340 220 L400 90" />
    <path d="M110 320 L40 260" />
    <path d="M320 300 L450 340" />
  </g>
  <g fill="#e8a33d">
    <circle cx="40" cy="620" r="4"/><circle cx="120" cy="480" r="4"/><circle cx="110" cy="320" r="4"/>
    <circle cx="200" cy="250" r="4"/><circle cx="190" cy="100" r="4"/><circle cx="260" cy="440" r="4"/>
    <circle cx="320" cy="300" r="4"/><circle cx="280" cy="150" r="4"/><circle cx="340" cy="220" r="4"/>
    <circle cx="400" cy="90" r="4"/><circle cx="40" cy="260" r="4"/><circle cx="450" cy="340" r="4"/>
  </g>
</svg>`;

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-hero">
        ${gridSVG}
        <div class="hero-mark serif">Perennial</div>
        <div class="hero-line">
          <h2>A private line between VoltIQ and the DisCos it works with — not the public cloud.</h2>
        </div>
        <div class="hero-foot">Every entry here is logged. Every account sees only its own record.</div>
      </div>
      <div class="login-form-side">
        <div class="login-box">
          <div class="wordmark serif">Sign in</div>
          <p class="tagline">Enter your credentials to continue.</p>
          <div id="login-error" class="msg-error" style="display:none;"></div>
          <label class="field-label" for="username">Username</label>
          <input id="username" class="field" type="text" autocomplete="username">
          <label class="field-label" for="password">Password</label>
          <input id="password" class="field" type="password" autocomplete="current-password">
          <button id="login-btn" class="btn" style="width:100%;">Sign in</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!username || !password) {
    errEl.textContent = 'Enter both username and password.';
    errEl.style.display = 'block';
    return;
  }
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      noAuth: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    saveSession(data);
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout() {
  clearSession();
  render();
}

async function renderDashboard() {
  const app = document.getElementById('app');
  const isAdmin = state.role === 'Administrator';

  app.innerHTML = `
    <div class="app">
      <div class="app-top">
        <div>
          <h1 class="wordmark serif">Perennial</h1>
          <div class="who">${state.username}<span class="stamp">${state.discoName || 'Administrator'}</span></div>
        </div>
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>

      <div class="notice">
        ${isAdmin
          ? 'You can see uploads across every DisCo. Each DisCo account can only ever see its own.'
          : 'You can see and upload only your own data. No other DisCo on this system can see yours, and you cannot see theirs.'}
      </div>

      <div class="panel">
        <div class="panel-title">Upload a file</div>
        <div id="upload-error" class="msg-error" style="display:none;"></div>
        <div id="upload-success" class="msg-ok" style="display:none;"></div>
        <div class="field-row">
          ${isAdmin ? `
          <div>
            <label class="field-label" for="upload-disco">DisCo name</label>
            <input id="upload-disco" class="field" type="text" placeholder="e.g. KEDCO">
          </div>` : ''}
          <div>
            <label class="field-label" for="upload-period">Period (optional)</label>
            <input id="upload-period" class="field" type="text" placeholder="e.g. 2026-09">
          </div>
        </div>
        <label class="field-label" for="upload-file">File</label>
        <input id="upload-file" class="field" type="file" accept=".csv,.xlsx,.xls" style="border-bottom:none; margin-bottom:24px;">
        <button id="upload-btn" class="btn">Upload</button>
      </div>

      ${isAdmin ? `
      <div class="panel">
        <div class="panel-title">Create a DisCo account</div>
        <div id="create-error" class="msg-error" style="display:none;"></div>
        <div id="create-success" class="msg-ok" style="display:none;"></div>
        <div class="field-row">
          <div>
            <label class="field-label" for="new-username">Username</label>
            <input id="new-username" class="field" type="text" placeholder="e.g. kedco">
          </div>
          <div>
            <label class="field-label" for="new-password">Password</label>
            <input id="new-password" class="field" type="text" placeholder="Generate separately">
          </div>
          <div>
            <label class="field-label" for="new-disco">DisCo name</label>
            <input id="new-disco" class="field" type="text" placeholder="e.g. KEDCO">
          </div>
        </div>
        <button id="create-btn" class="btn">Create account</button>
      </div>` : ''}

      <div class="panel">
        <div class="panel-title">${isAdmin ? 'All uploads' : 'Your uploads'}</div>
        <div id="uploads-list"></div>
      </div>
    </div>
  `;

  document.getElementById('logout-btn').onclick = logout;
  document.getElementById('upload-btn').onclick = doUpload;
  if (isAdmin) document.getElementById('create-btn').onclick = doCreateDisco;

  await loadUploads();
}

async function doUpload() {
  const btn = document.getElementById('upload-btn');
  const errEl = document.getElementById('upload-error');
  const okEl = document.getElementById('upload-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const fileInput = document.getElementById('upload-file');
  const period = document.getElementById('upload-period').value.trim();
  const discoInput = document.getElementById('upload-disco');
  const discoName = discoInput ? discoInput.value.trim() : null;

  if (!fileInput.files.length) {
    errEl.textContent = 'Choose a file first.';
    errEl.style.display = 'block';
    return;
  }
  if (discoInput && !discoName) {
    errEl.textContent = 'Enter which DisCo this upload is for.';
    errEl.style.display = 'block';
    return;
  }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  if (period) formData.append('period', period);
  if (discoName) formData.append('discoName', discoName);

  btn.disabled = true;
  btn.textContent = 'Uploading…';
  try {
    await api('/ingest', { method: 'POST', body: formData });
    okEl.textContent = 'Upload received.';
    okEl.style.display = 'block';
    fileInput.value = '';
    document.getElementById('upload-period').value = '';
    if (discoInput) discoInput.value = '';
    await loadUploads();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
}

async function doCreateDisco() {
  const btn = document.getElementById('create-btn');
  const errEl = document.getElementById('create-error');
  const okEl = document.getElementById('create-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const discoName = document.getElementById('new-disco').value.trim();

  if (!username || !password || !discoName) {
    errEl.textContent = 'Fill in all three fields.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  try {
    await api('/admin/discos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, discoName }),
    });
    okEl.textContent = `Account created for ${discoName}. Share the credentials with them directly — not by email.`;
    okEl.style.display = 'block';
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-disco').value = '';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function loadUploads() {
  const listEl = document.getElementById('uploads-list');
  listEl.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const data = await api('/uploads');
    if (!data.uploads.length) {
      listEl.innerHTML = '<p class="empty">Nothing uploaded yet.</p>';
      return;
    }
    const isAdmin = state.role === 'Administrator';
    listEl.innerHTML = `
      <table>
        <thead>
          <tr>
            ${isAdmin ? '<th>DisCo</th>' : ''}
            <th>File</th>
            <th>Period</th>
            <th>Size</th>
            <th>Uploaded</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${data.uploads.map(u => `
            <tr>
              ${isAdmin ? `<td>${u.disco_name}</td>` : ''}
              <td>${u.original_filename}</td>
              <td>${u.period || '—'}</td>
              <td>${formatBytes(u.file_size_bytes)}</td>
              <td>${formatDate(u.uploaded_at)}</td>
              <td>${u.status}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    listEl.innerHTML = `<p class="msg-error">${e.message}</p>`;
  }
}

async function render() {
  if (!state.token) {
    renderLogin();
    return;
  }
  try {
    await api('/auth/verify');
    await renderDashboard();
  } catch (e) {
    clearSession();
    renderLogin();
  }
}

render();
</script>
</body>
</html>
