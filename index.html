<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perennial — VoltIQ Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0f1e;
    --ink-2: #0d1424;
    --panel: #121b32;
    --panel-2: #182541;
    --line: #293759;
    --paper: #eef0f6;
    --paper-dim: #8a93b3;
    --copper: #d68a2e;
    --copper-bright: #eeae52;
    --copper-dim: rgba(214, 138, 46, 0.15);
    --verified: #4fb286;
    --alert: #e0776a;
    --pending: #6d8fd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(214, 138, 46, 0.08), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(79, 178, 134, 0.05), transparent 60%),
      var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, .serif { font-family: 'Source Serif 4', Georgia, serif; }
  ::selection { background: var(--copper); color: var(--ink); }

  .login-screen { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 100vh; }
  @media (max-width: 860px) {
    .login-screen { grid-template-columns: 1fr; }
    .login-hero { display: none; }
  }
  .login-hero {
    background: linear-gradient(160deg, rgba(18, 27, 50, 0.75) 0%, rgba(13, 20, 36, 0.85) 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px;
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  .hero-mark { font-size: 15px; letter-spacing: 0.02em; color: var(--paper-dim); position: relative; z-index: 1; }
  .hero-line { position: relative; z-index: 1; }
  .hero-line h2 { font-size: 32px; font-weight: 500; line-height: 1.32; margin: 0; max-width: 380px; color: var(--paper); }
  .hero-line h2 em { font-style: normal; color: var(--copper-bright); }
  .hero-foot { font-size: 13px; color: var(--paper-dim); position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
  .hero-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--verified); flex-shrink: 0; }

  .login-form-side { display: flex; align-items: center; justify-content: center; padding: 40px; }
  .login-box { width: 100%; max-width: 340px; }
  .login-box .wordmark { font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  .login-box .tagline { font-size: 13px; color: var(--paper-dim); margin: 0 0 40px; }
  .field-label { display: block; font-size: 12px; color: var(--paper-dim); margin-bottom: 7px; }
  .field {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--paper);
    padding: 10px 2px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 26px;
    transition: border-color 0.2s;
  }
  .field:focus { outline: none; border-bottom-color: var(--copper-bright); }
  .field::placeholder { color: #4a5578; }

  .btn {
    background: var(--copper);
    color: var(--ink);
    border: none;
    border-radius: 4px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: var(--copper-bright); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--paper); border-radius: 4px; }
  .btn-ghost:hover { border-color: var(--paper-dim); background: var(--panel-2); }
  .msg-error { color: var(--alert); font-size: 13px; margin: -14px 0 20px; }
  .msg-ok { color: var(--verified); font-size: 13px; margin: -14px 0 20px; }

  .app { max-width: 980px; margin: 0 auto; padding: 52px 28px 90px; }
  .app-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 22px;
    margin-bottom: 36px;
    position: relative;
  }
  .app-top::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--copper) 0%, var(--line) 18%, var(--line) 100%);
  }
  .app-top .wordmark { font-size: 26px; font-weight: 500; margin: 0; }
  .who { font-size: 13px; color: var(--paper-dim); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .stamp {
    display: inline-block;
    border: 1px solid var(--copper);
    color: var(--copper-bright);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 3px;
    letter-spacing: 0.03em;
    background: var(--copper-dim);
  }

  .notice {
    border-radius: 6px;
    border: 1px solid rgba(214, 138, 46, 0.25);
    border-left: 3px solid var(--copper);
    padding: 14px 20px;
    font-size: 13px;
    color: var(--paper-dim);
    margin-bottom: 32px;
    background: linear-gradient(90deg, var(--copper-dim), transparent 60%), var(--panel);
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    padding: 30px;
    margin-bottom: 24px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
  }
  .panel-title { font-size: 17px; font-weight: 500; margin: 0 0 22px; display: flex; align-items: center; gap: 10px; }
  .panel-title::before { content: ''; width: 3px; height: 16px; background: var(--copper); border-radius: 2px; display: inline-block; }
  .field-row { display: flex; gap: 26px; }
  .field-row > div { flex: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--paper-dim);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 0 12px 12px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 13px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty { color: var(--paper-dim); font-size: 14px; padding: 32px 0; text-align: center; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.received { background: rgba(109, 143, 214, 0.12); color: var(--pending); }
  .badge.received .dot { background: var(--pending); }
  .badge.parsed { background: rgba(79, 178, 134, 0.12); color: var(--verified); }
  .badge.parsed .dot { background: var(--verified); }
  .badge.failed { background: rgba(224, 119, 106, 0.12); color: var(--alert); }
  .badge.failed .dot { background: var(--alert); }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.11;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="bg-grid" id="bg-grid"></div>
<div id="app"></div>

<script>
const API_BASE = 'https://perennial-ingest.momolistic2008.workers.dev';

let state = {
  token: localStorage.getItem('perennial_token') || null,
  username: localStorage.getItem('perennial_username') || null,
  role: localStorage.getItem('perennial_role') || null,
  discoName: localStorage.getItem('perennial_disco') || null,
};

function saveSession(data) {
  state.token = data.token;
  state.username = data.username;
  state.role = data.role;
  state.discoName = data.discoName;
  localStorage.setItem('perennial_token', data.token);
  localStorage.setItem('perennial_username', data.username);
  localStorage.setItem('perennial_role', data.role);
  localStorage.setItem('perennial_disco', data.discoName || '');
}

function clearSession() {
  state = { token: null, username: null, role: null, discoName: null };
  localStorage.removeItem('perennial_token');
  localStorage.removeItem('perennial_username');
  localStorage.removeItem('perennial_role');
  localStorage.removeItem('perennial_disco');
}

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (state.token && !options.noAuth) {
    headers['Authorization'] = `Bearer ${state.token}`;
  }
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(iso) {
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function statusBadge(status) {
  const cls = status === 'parsed' ? 'parsed' : status === 'failed' ? 'failed' : 'received';
  return `<span class="badge ${cls}"><span class="dot"></span>${status}</span>`;
}

const gridSVG = `
<svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
  <g stroke="#d68a2e" stroke-width="1" fill="none">
    <path d="M40 800 L180 620 L160 400 L320 320 L300 100" />
    <path d="M180 620 L400 560 L500 380 L440 190" />
    <path d="M320 320 L560 280 L660 110" />
    <path d="M160 400 L40 320" />
    <path d="M500 380 L720 430 L900 340 L980 150" />
    <path d="M660 110 L840 60" />
    <path d="M900 340 L1100 400 L1220 250" />
    <path d="M720 430 L760 620 L620 720" />
    <path d="M1100 400 L1180 600 L1000 700" />
    <path d="M980 150 L1150 90 L1330 160" />
  </g>
  <g fill="#e8a33d">
    <circle cx="40" cy="800" r="4"/><circle cx="180" cy="620" r="4"/><circle cx="160" cy="400" r="4"/>
    <circle cx="320" cy="320" r="4"/><circle cx="300" cy="100" r="4"/><circle cx="400" cy="560" r="4"/>
    <circle cx="500" cy="380" r="4"/><circle cx="440" cy="190" r="4"/><circle cx="560" cy="280" r="4"/>
    <circle cx="660" cy="110" r="4"/><circle cx="40" cy="320" r="4"/><circle cx="720" cy="430" r="4"/>
    <circle cx="900" cy="340" r="4"/><circle cx="980" cy="150" r="4"/><circle cx="840" cy="60" r="4"/>
    <circle cx="1100" cy="400" r="4"/><circle cx="1220" cy="250" r="4"/><circle cx="760" cy="620" r="4"/>
    <circle cx="620" cy="720" r="4"/><circle cx="1180" cy="600" r="4"/><circle cx="1000" cy="700" r="4"/>
    <circle cx="1150" cy="90" r="4"/><circle cx="1330" cy="160" r="4"/>
  </g>
</svg>`;
document.getElementById('bg-grid').innerHTML = gridSVG;

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-hero">
        <div class="hero-mark serif">Perennial</div>
        <div class="hero-line">
          <h2>A private line between VoltIQ and the DisCos it works with — not <em>the public cloud.</em></h2>
        </div>
        <div class="hero-foot"><span class="dot"></span>Every entry here is logged. Every account sees only its own record.</div>
      </div>
      <div class="login-form-side">
        <div class="login-box">
          <div class="wordmark serif">Sign in</div>
          <p class="tagline">Enter your credentials to continue.</p>
          <div id="login-error" class="msg-error" style="display:none;"></div>
          <label class="field-label" for="username">Username</label>
          <input id="username" class="field" type="text" autocomplete="username">
          <label class="field-label" for="password">Password</label>
          <input id="password" class="field" type="password" autocomplete="current-password">
          <button id="login-btn" class="btn" style="width:100%;">Sign in</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!username || !password) {
    errEl.textContent = 'Enter both username and password.';
    errEl.style.display = 'block';
    return;
  }
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      noAuth: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    saveSession(data);
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout() {
  clearSession();
  render();
}

async function renderDashboard() {
  const app = document.getElementById('app');
  const isAdmin = state.role === 'Administrator';
  const canSeeAll = isAdmin || state.role === 'TeamMember';

  app.innerHTML = `
    <div class="app">
      <div class="app-top">
        <div>
          <h1 class="wordmark serif">Perennial</h1>
          <div class="who">${state.username}<span class="stamp">${state.discoName || state.role}</span></div>
        </div>
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>

      <div class="notice">
        ${canSeeAll
          ? 'You can see uploads across every DisCo. Each DisCo account can only ever see its own.'
          : 'You can see and upload only your own data. No other DisCo on this system can see yours, and you cannot see theirs.'}
      </div>

      <div class="panel">
        <div class="panel-title">Upload a file</div>
        <div id="upload-error" class="msg-error" style="display:none;"></div>
        <div id="upload-success" class="msg-ok" style="display:none;"></div>
        <div class="field-row">
          ${canSeeAll ? `
          <div>
            <label class="field-label" for="upload-disco">DisCo name</label>
            <input id="upload-disco" class="field" type="text" placeholder="e.g. KEDCO">
          </div>` : ''}
          <div>
            <label class="field-label" for="upload-period">Period (optional)</label>
            <input id="upload-period" class="field" type="text" placeholder="e.g. 2026-09">
          </div>
        </div>
        <label class="field-label" for="upload-file">File</label>
        <input id="upload-file" class="field" type="file" accept=".csv,.xlsx,.xls" style="border-bottom:none; margin-bottom:24px;">
        <button id="upload-btn" class="btn">Upload</button>
      </div>

      ${isAdmin ? `
      <div class="panel">
        <div class="panel-title">Create a DisCo account</div>
        <div id="create-error" class="msg-error" style="display:none;"></div>
        <div id="create-success" class="msg-ok" style="display:none;"></div>
        <div class="field-row">
          <div>
            <label class="field-label" for="new-username">Username</label>
            <input id="new-username" class="field" type="text" placeholder="e.g. kedco">
          </div>
          <div>
            <label class="field-label" for="new-password">Password</label>
            <input id="new-password" class="field" type="text" placeholder="Generate separately">
          </div>
          <div>
            <label class="field-label" for="new-disco">DisCo name</label>
            <input id="new-disco" class="field" type="text" placeholder="e.g. KEDCO">
          </div>
        </div>
        <button id="create-btn" class="btn">Create account</button>
      </div>

      <div class="panel">
        <div class="panel-title">Create a team member account</div>
        <div id="create-team-error" class="msg-error" style="display:none;"></div>
        <div id="create-team-success" class="msg-ok" style="display:none;"></div>
        <p style="font-size:13px;color:var(--paper-dim);margin:-8px 0 20px;">Sees and uploads for every DisCo, like you — but cannot create accounts or delete any DisCo's data.</p>
        <div class="field-row">
          <div>
            <label class="field-label" for="new-team-username">Username</label>
            <input id="new-team-username" class="field" type="text" placeholder="e.g. bola">
          </div>
          <div>
            <label class="field-label" for="new-team-password">Password</label>
            <input id="new-team-password" class="field" type="text" placeholder="Generate separately">
          </div>
        </div>
        <button id="create-team-btn" class="btn">Create account</button>
      </div>` : ''}

      <div class="panel">
        <div class="panel-title">${canSeeAll ? 'All uploads' : 'Your uploads'}</div>
        <div id="uploads-list"></div>
      </div>
    </div>
  `;

  document.getElementById('logout-btn').onclick = logout;
  document.getElementById('upload-btn').onclick = doUpload;
  if (isAdmin) {
    document.getElementById('create-btn').onclick = doCreateDisco;
    document.getElementById('create-team-btn').onclick = doCreateTeamMember;
  }

  await loadUploads();
}

async function doUpload() {
  const btn = document.getElementById('upload-btn');
  const errEl = document.getElementById('upload-error');
  const okEl = document.getElementById('upload-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const fileInput = document.getElementById('upload-file');
  const period = document.getElementById('upload-period').value.trim();
  const discoInput = document.getElementById('upload-disco');
  const discoName = discoInput ? discoInput.value.trim() : null;

  if (!fileInput.files.length) {
    errEl.textContent = 'Choose a file first.';
    errEl.style.display = 'block';
    return;
  }
  if (discoInput && !discoName) {
    errEl.textContent = 'Enter which DisCo this upload is for.';
    errEl.style.display = 'block';
    return;
  }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  if (period) formData.append('period', period);
  if (discoName) formData.append('discoName', discoName);

  btn.disabled = true;
  btn.textContent = 'Uploading…';
  try {
    await api('/ingest', { method: 'POST', body: formData });
    okEl.textContent = 'Upload received.';
    okEl.style.display = 'block';
    fileInput.value = '';
    document.getElementById('upload-period').value = '';
    if (discoInput) discoInput.value = '';
    await loadUploads();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
}

async function doCreateDisco() {
  const btn = document.getElementById('create-btn');
  const errEl = document.getElementById('create-error');
  const okEl = document.getElementById('create-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const discoName = document.getElementById('new-disco').value.trim();

  if (!username || !password || !discoName) {
    errEl.textContent = 'Fill in all three fields.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  try {
    await api('/admin/discos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, discoName }),
    });
    okEl.textContent = `Account created for ${discoName}. Share the credentials with them directly — not by email.`;
    okEl.style.display = 'block';
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-disco').value = '';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function doCreateTeamMember() {
  const btn = document.getElementById('create-team-btn');
  const errEl = document.getElementById('create-team-error');
  const okEl = document.getElementById('create-team-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  const username = document.getElementById('new-team-username').value.trim();
  const password = document.getElementById('new-team-password').value;

  if (!username || !password) {
    errEl.textContent = 'Fill in both fields.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  try {
    await api('/admin/team', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    okEl.textContent = `Team account created for ${username}. Share the credentials with them directly — not by email.`;
    okEl.style.display = 'block';
    document.getElementById('new-team-username').value = '';
    document.getElementById('new-team-password').value = '';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function loadUploads() {
  const listEl = document.getElementById('uploads-list');
  listEl.innerHTML = '<p class="empty">Loading…</p>';
  try {
    const data = await api('/uploads');
    if (!data.uploads.length) {
      listEl.innerHTML = '<p class="empty">Nothing uploaded yet.</p>';
      return;
    }
    const showDiscoColumn = state.role === 'Administrator' || state.role === 'TeamMember';
    listEl.innerHTML = `
      <table>
        <thead>
          <tr>
            ${showDiscoColumn ? '<th>DisCo</th>' : ''}
            <th>File</th>
            <th>Period</th>
            <th>Size</th>
            <th>Uploaded</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${data.uploads.map(u => `
            <tr>
              ${showDiscoColumn ? `<td>${u.disco_name}</td>` : ''}
              <td>${u.original_filename}</td>
              <td>${u.period || '—'}</td>
              <td>${formatBytes(u.file_size_bytes)}</td>
              <td>${formatDate(u.uploaded_at)}</td>
              <td>${statusBadge(u.status)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    listEl.innerHTML = `<p class="msg-error">${e.message}</p>`;
  }
}

async function render() {
  if (!state.token) {
    renderLogin();
    return;
  }
  try {
    await api('/auth/verify');
    await renderDashboard();
  } catch (e) {
    clearSession();
    renderLogin();
  }
}

render();
</script>
